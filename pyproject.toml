[project]
name = "mini-onyx"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.133.1",
    "litellm==1.93.1",
    "pydantic==2.12.5",
    "uvicorn==0.49.0",
]


[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["mini_onyx"]

[tool.ty.environment]
python-version = "3.13"
root = ["./backend"]
extra-paths = ["backend"]

[tool.ty.src]
include = ["backend", "tests"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pre-commit==4.6.2",
    "pytest==9.0.3",
    "ruff==0.16.1",
    "ty==0.0.63",
]
