services:
  postgres:
    image: postgres:15.2-alpine
    container_name: mini-onyx-postgres
    environment:
      POSTGRES_DB: mini_onyx
      POSTGRES_USER: mini_onyx
      POSTGRES_PASSWORD: mini_onyx_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U mini_onyx -d mini_onyx",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    container_name: mini-onyx-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mini_onyx_dev
      MINIO_ROOT_PASSWORD: mini_onyx_dev_password
    ports:
      - "127.0.0.1:9004:9000"
      - "127.0.0.1:9005:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
