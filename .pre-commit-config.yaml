repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false

      - id: web-test
        name: Web tests
        entry: bun --cwd web test
        language: system
        pass_filenames: false
        files: ^web/

      - id: web-typecheck
        name: Web type check
        entry: bun run --cwd web typecheck
        language: system
        pass_filenames: false
        files: ^web/
